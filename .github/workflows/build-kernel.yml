name: Build Kernel (KernelSU-Next + SUSFS)

# Builds the Android emulator (goldfish/ranchu) kernel for nunu's native macOS
# app, which runs Google's Android emulator engine — NOT Cuttlefish. The stock
# image ships 6.1.23-android14 (GKI android14-6.1), so we build that branch and
# publish a drop-in `kernel-ranchu`.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      kernel_branch:
        description: 'Android kernel branch (match the emulator image)'
        required: false
        default: 'android14-6.1'

env:
  KERNEL_BRANCH: ${{ github.event.inputs.kernel_branch || 'android14-6.1' }}
  SUSFS_VER: '6.1'
  ARCH: arm64

jobs:
  build:
    name: Build ${{ github.event.inputs.kernel_branch || 'android14-6.1' }} + KernelSU-Next + SUSFS
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout nunu-kernel
        uses: actions/checkout@v4

      # ── 2. Dependencies + LLVM/Clang ────────────────────────────────────────
      # Use Ubuntu 22.04's own clang (no apt.llvm.org — that host was unreachable
      # from the runner and isn't needed; distro clang-15 builds android14-6.1).
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libssl-dev libelf-dev libncurses-dev \
            python3 python3-pip git curl unzip rsync \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            cpio kmod make dwarves

          # Prefer clang-15, fall back to 14, then the distro default.
          LLVM_VER=""
          for v in 15 14; do
            if sudo apt-get install -y --no-install-recommends \
                 clang-$v lld-$v llvm-$v; then LLVM_VER=$v; break; fi
          done
          if [ -z "$LLVM_VER" ]; then
            sudo apt-get install -y --no-install-recommends clang lld llvm
          else
            for t in clang clang++ lld ld.lld llvm-ar llvm-nm llvm-objcopy llvm-objdump llvm-strip llvm-readelf; do
              [ -e /usr/bin/$t-$LLVM_VER ] && sudo update-alternatives --install /usr/bin/$t $t /usr/bin/$t-$LLVM_VER 100 || true
            done
          fi
          echo "Clang: $(clang --version | head -1)"
          echo "ld.lld: $(ld.lld --version | head -1)"

      # ── 3. Cache + clone kernel source ──────────────────────────────────────
      - name: Cache kernel source
        uses: actions/cache@v4
        id: cache-kernel
        with:
          path: kernel/common
          key: kernel-${{ env.KERNEL_BRANCH }}-${{ hashFiles('kernel/.kernel-rev') }}
          restore-keys: kernel-${{ env.KERNEL_BRANCH }}-

      - name: Clone kernel/common
        if: steps.cache-kernel.outputs.cache-hit != 'true'
        run: |
          git clone --depth=1 --branch ${{ env.KERNEL_BRANCH }} \
            https://android.googlesource.com/kernel/common kernel/common
          git -C kernel/common rev-parse HEAD > kernel/.kernel-rev

      # ── 4. Apply KernelSU-Next ──────────────────────────────────────────────
      # KernelSU-Next (not tiann/KernelSU): it's the SUSFS-integrated fork, and it
      # must match the KernelSU-Next manager app the nunu app installs.
      - name: Apply KernelSU-Next
        working-directory: kernel/common
        run: |
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s next
          echo "KernelSU-Next applied:"
          ls drivers/kernelsu/ 2>/dev/null || ls KernelSU-Next 2>/dev/null || true

      # ── 5. Apply SUSFS patches (kernel-side hiding) ─────────────────────────
      - name: Apply SUSFS
        working-directory: kernel/common
        run: |
          git clone --depth=1 -b "gki-${KERNEL_BRANCH}" \
            https://gitlab.com/simonpunk/susfs4ksu.git /tmp/susfs4ksu \
            || git clone --depth=1 https://gitlab.com/simonpunk/susfs4ksu.git /tmp/susfs4ksu

          PATCH_DIR="/tmp/susfs4ksu/kernel_patches"
          # Kernel-core SUSFS patch for this version
          if [ -f "$PATCH_DIR/50_add_susfs_in_gki-${KERNEL_BRANCH}.patch" ]; then
            patch -p1 < "$PATCH_DIR/50_add_susfs_in_gki-${KERNEL_BRANCH}.patch" || patch -p1 --forward < "$PATCH_DIR/50_add_susfs_in_gki-${KERNEL_BRANCH}.patch" || true
          elif ls "$PATCH_DIR/${SUSFS_VER}/"*.patch >/dev/null 2>&1; then
            for p in "$PATCH_DIR/${SUSFS_VER}/"*.patch; do
              patch -p1 < "$p" || patch -p1 --forward < "$p" || true
            done
          else
            echo "No matching SUSFS patch; available:"; ls "$PATCH_DIR" || true
          fi

          cp -r "$PATCH_DIR"/fs/*      fs/      2>/dev/null || true
          cp -r "$PATCH_DIR"/include/* include/ 2>/dev/null || true
          echo "SUSFS applied."

      # ── 6. Configure for the emulator (goldfish/ranchu + virtio) ────────────
      - name: Configure kernel
        working-directory: kernel/common
        run: |
          # The emulator kernel is GKI + goldfish/ranchu platform devices.
          make ARCH=arm64 LLVM=1 LLVM_IAS=1 CC=clang LD=ld.lld gki_defconfig

          # KernelSU-Next
          scripts/config --enable CONFIG_KSU

          # SUSFS feature set (root/mount/stat hiding + uname spoof)
          for f in CONFIG_KSU_SUSFS CONFIG_KSU_SUSFS_SUS_PATH CONFIG_KSU_SUSFS_SUS_MOUNT \
                   CONFIG_KSU_SUSFS_SUS_KSTAT CONFIG_KSU_SUSFS_SUS_OVERLAYFS \
                   CONFIG_KSU_SUSFS_TRY_UMOUNT CONFIG_KSU_SUSFS_SPOOF_UNAME \
                   CONFIG_KSU_SUSFS_ENABLE_LOG CONFIG_KSU_SUSFS_OPEN_REDIRECT \
                   CONFIG_KSU_SUSFS_SUS_SU; do
            scripts/config --enable $f || true
          done

          # Module loading + probes
          scripts/config --enable CONFIG_MODULES
          scripts/config --enable CONFIG_MODULE_UNLOAD
          scripts/config --enable CONFIG_KPROBES

          # BTF generation needs a matching pahole and isn't needed to boot the
          # emulator; disable it so the vmlinux link doesn't fail on the runner.
          scripts/config --disable CONFIG_DEBUG_INFO_BTF
          scripts/config --disable CONFIG_DEBUG_INFO_BTF_MODULES

          # Goldfish / ranchu platform (emulated hardware the AVD exposes)
          for g in CONFIG_GOLDFISH CONFIG_GOLDFISH_PIPE CONFIG_GOLDFISH_BUS \
                   CONFIG_ANDROID_BINDER_IPC CONFIG_ANDROID_BINDERFS \
                   CONFIG_VIRTIO CONFIG_VIRTIO_PCI CONFIG_VIRTIO_MMIO \
                   CONFIG_VIRTIO_NET CONFIG_VIRTIO_BLK CONFIG_VIRTIO_CONSOLE \
                   CONFIG_VIRTIO_INPUT CONFIG_DRM_VIRTIO_GPU CONFIG_VIRTIO_BALLOON; do
            scripts/config --enable $g || true
          done

          yes "" | make ARCH=arm64 LLVM=1 LLVM_IAS=1 CC=clang LD=ld.lld olddefconfig

      # ── 7. Build ─────────────────────────────────────────────────────────────
      - name: Build kernel
        working-directory: kernel/common
        run: |
          make ARCH=arm64 LLVM=1 LLVM_IAS=1 CC=clang LD=ld.lld \
            -j$(nproc) Image Image.gz 2>&1 | tee ../build.log
          ls -lh arch/arm64/boot/Image*

      # ── 8. Package (drop-in kernel-ranchu for nunu) ─────────────────────────
      - name: Package artifacts
        run: |
          mkdir -p out
          # nunu's app downloads the asset named exactly `kernel-ranchu`. The stock
          # emulator kernel is gzip'd, and `-kernel` accepts gzip, so publish Image.gz
          # under that name.
          cp kernel/common/arch/arm64/boot/Image.gz out/kernel-ranchu
          cp kernel/common/arch/arm64/boot/Image.gz out/Image.gz
          cp kernel/common/arch/arm64/boot/Image    out/Image

          KVER=$(cat kernel/common/include/config/kernel.release 2>/dev/null || echo "$KERNEL_BRANCH-ksunext-susfs")
          {
            echo "Kernel:       $KVER"
            echo "Branch:       $KERNEL_BRANCH"
            echo "KernelSU:     KernelSU-Next (next)"
            echo "SUSFS:        $SUSFS_VER"
            echo "Built:        $(date -u)"
          } > out/build-info.txt
          cat out/build-info.txt; ls -lh out/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nunu-kernel-${{ env.KERNEL_BRANCH }}
          path: out/
          retention-days: 30

      # ── 9. Release (tag builds) ──────────────────────────────────────────────
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/kernel-ranchu
            out/Image.gz
            out/build-info.txt
          body: |
            ## nunu-kernel ${{ github.ref_name }}

            Android **emulator** (goldfish/ranchu) kernel for nunu — `${{ env.KERNEL_BRANCH }}` with:
            - **KernelSU-Next** — root management
            - **SUSFS** — kernel-side root hiding

            ### Usage
            In nunu → Settings → Root → Download kernel + manager. nunu boots this
            kernel only when root is enabled; stock boot is untouched.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
